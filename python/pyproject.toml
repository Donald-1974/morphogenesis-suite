[project]
name = "morphogenesis"
version = "0.1.0"
description = "NumPy port of the MAC–SPH–turgor tri-coupled morphogenesis solver."
readme = "../README.md"
license = { text = "MIT" }
authors = [{ name = "Sai Genoa (Genoa Page)", email = "pagegenoa171@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
morphogenesis = "morphogenesis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["morphogenesis*"]
